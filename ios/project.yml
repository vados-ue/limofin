name: LimoFin
options:
  bundleIdPrefix: com.limones
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.3.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  LimoFin:
    type: application
    platform: iOS
    sources:
      - LimoFin
    dependencies:
      - target: LimoFinWidget
        embed: true
    info:
      path: LimoFin/Info.plist
      properties:
        CFBundleDisplayName: LimoFin
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: LimoFin scans receipts with the camera.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limones.limofin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LimoFin
  LimoFinWidget:
    type: app-extension
    platform: iOS
    sources:
      - LimoFinWidget
    info:
      path: LimoFinWidget/Info.plist
      properties:
        CFBundleDisplayName: LimoFin Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limones.limofin.widget
        TARGETED_DEVICE_FAMILY: "1"
